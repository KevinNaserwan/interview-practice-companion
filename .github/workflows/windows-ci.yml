name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore
        run: dotnet restore InterviewPracticeCompanion.sln

      - name: Build Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet build InterviewPracticeCompanion.sln -c Release --no-restore 2>&1 | Tee-Object artifacts/build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content artifacts/build.log | Where-Object { $_ -match 'error|failed|exception' } | Select-Object -Last 20 | ForEach-Object { Write-Host "::error file=src/InterviewPracticeCompanion/InterviewPracticeCompanion.csproj::$($_ -replace '%','%25' -replace "`r?`n",'%0A')" }
            throw "Build failed."
          }
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostic
          path: artifacts/build.log
          retention-days: 2

      - name: Test full solution
        run: dotnet test InterviewPracticeCompanion.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish self-contained x64
        run: >-
          dotnet publish src/InterviewPracticeCompanion/InterviewPracticeCompanion.csproj
          -c Release -r win-x64 --self-contained true
          -o artifacts/publish
      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\publish\* -DestinationPath artifacts\InterviewPracticeCompanion-portable-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts\InterviewPracticeCompanion-portable-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  InterviewPracticeCompanion-portable-win-x64.zip" | Set-Content artifacts\InterviewPracticeCompanion-portable-win-x64.zip.sha256
          $url = curl.exe -fsS -F "file=@artifacts/InterviewPracticeCompanion-portable-win-x64.zip" https://temp.sh/upload
          Write-Host "::notice title=Portable ZIP mirror::$url"
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: InterviewPracticeCompanion-portable-win-x64
          path: |
            artifacts/InterviewPracticeCompanion-portable-win-x64.zip
            artifacts/InterviewPracticeCompanion-portable-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Smoke startup
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "InterviewPracticeCompanion-startup.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process "artifacts\publish\InterviewPracticeCompanion.exe" -PassThru
          Start-Sleep -Seconds 8
          if (Test-Path $log) {
            $diagnostic = Get-Content $log -Raw
            Copy-Item $log "artifacts\startup-diagnostic.log"
            Write-Host "::error title=WPF startup diagnostic::$($diagnostic -replace "`r?`n", '%0A')"
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "Application wrote a startup diagnostic."
          }
          if ($process.HasExited) {
            Write-Host "::error title=Early application exit::Exit code $($process.ExitCode); no startup diagnostic was written."
            throw "Application exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload startup diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostic
          path: artifacts/startup-diagnostic.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

